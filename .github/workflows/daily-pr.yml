name: Daily Portfolio PR

on:
  schedule:
    # 08:00 Asia/Tehran (UTC+03:30)
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.DAILY_AUTOMATION_TOKEN || github.token }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run automation tests
        run: python -m unittest discover -s tests

      - name: Configure git identity
        run: |
          git config user.name "S.Ali Zahiri"
          git config user.email "1667665+AliZahiri@users.noreply.github.com"

      - name: Create daily PR
        env:
          GH_TOKEN: ${{ secrets.DAILY_AUTOMATION_TOKEN || github.token }}
          DAILY_PR_REPO: ${{ github.repository }}
        run: python .github/scripts/daily_pr.py --repo "$DAILY_PR_REPO" --create-pr
